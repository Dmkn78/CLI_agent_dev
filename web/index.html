<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="atelier-token" content="__ATELIER_TOKEN__" />
    <meta name="theme-color" content="#101114" />
    <title>Atelier · Agents & projets</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/core.js" defer></script>
    <script src="/views.js" defer></script>
    <script src="/cockpit.js" defer></script>
    <script src="/chat.js" defer></script>
    <script src="/forms.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#overview"
          ><img src="/icon.svg" alt="" width="31" height="31" /><span
            >atelier<span class="brand-dot">.</span></span
          ><small>LOCAL</small></a
        >
        <button
          class="project-switch"
          id="project-switch"
          aria-label="Changer de projet"
        >
          <span class="project-avatar">A</span
          ><span
            ><strong id="project-name">Atelier</strong
            ><small>Espace de travail</small></span
          ><span class="chevrons">⌃<br />⌄</span>
        </button>
        <div class="nav-label">ESPACE DE TRAVAIL</div>
        <nav id="main-nav" aria-label="Navigation principale"></nav>
        <div class="sidebar-projects">
          <div class="nav-label">
            MES PROJETS
            <button
              id="add-project"
              title="Ajouter un projet"
              aria-label="Ajouter un projet"
            >
              +
            </button>
          </div>
          <div id="project-list"></div>
        </div>
        <div class="sidebar-bottom">
          <div class="local-status">
            <span class="status-dot"></span> Stockage local
            <span>↗</span>
          </div>
          <button class="profile" id="settings-shortcut">
            <span class="profile-avatar">D</span
            ><span
              ><strong>Mon environnement</strong
              ><small>Abonnements & connexions</small></span
            ><span>⚙</span>
          </button>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="breadcrumb">
            <span id="breadcrumb-project">Atelier</span><span>/</span
            ><strong id="breadcrumb-view">Vue d’ensemble</strong>
          </div>
          <div class="topbar-actions">
            <button class="search-trigger" id="global-search">
              ⌕ <span>Rechercher dans le projet</span><kbd>⌘ K</kbd></button
            ><span class="topbar-divider"></span
            ><button
              class="icon-btn"
              id="audit-shortcut"
              title="Journal d’activité"
              aria-label="Journal d’activité"
            ></button
            ><span class="avatar-small">D</span>
          </div>
        </header>
        <main id="main" tabindex="-1"></main>
        <footer class="statusbar">
          <span><i class="status-dot"></i> Serveur local connecté</span
          ><span id="footer-sessions">Aucune session active</span
          ><span class="statusbar-right"
            >Atelier <span>0.1</span><span>↗</span></span
          >
        </footer>
      </div>
    </div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <div id="toasts" role="status" aria-live="polite"></div>
  </body>
</html>
